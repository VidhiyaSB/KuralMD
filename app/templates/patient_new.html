{% extends "base.html" %}
{% block title %}Register patient{% endblock %}
{% block content %}
<a href="/patients" class="text-sm text-slate-500 hover:text-slate-800">← Patients</a>
<h1 class="text-2xl font-bold text-slate-900 mt-2 mb-4">Register patient</h1>
<form method="post" action="/patients" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 grid sm:grid-cols-2 gap-4 max-w-2xl">
  <label class="sm:col-span-2 text-sm font-medium">Name (fictional)<input required name="name" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-100 outline-none"></label>
  <label class="text-sm font-medium">Age<input required type="number" min="0" max="120" name="age" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200"></label>
  <label class="text-sm font-medium">Sex
    <select name="sex" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white"><option value="F">Female</option><option value="M">Male</option><option value="O">Other</option></select></label>
  <label class="text-sm font-medium">Blood group<input name="blood_group" placeholder="e.g. B+" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200"></label>
  <label class="text-sm font-medium">Preferred language
    <select name="preferred_language" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-white font-tamil"><option value="ta">தமிழ் (Tamil)</option><option value="en">English</option></select></label>
  <label class="text-sm font-medium">Assigned student<input name="assigned_student" value="Divya R" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200"></label>
  <label class="text-sm font-medium">Known allergies<input name="known_allergies" class="mt-1 w-full px-3 py-2.5 rounded-xl border border-slate-200"></label>
  <div class="sm:col-span-2 flex justify-end"><button class="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold">Register</button></div>
</form>
{% endblock %}
